# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - marketeye-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.400; keep this in the same band so the runner
          # does not resolve an SDK the solution refuses to build with.
          dotnet-version: '10.0.x'

      # Restore the whole solution (project references span all 11 projects) but
      # build and publish ONLY the API. Azure's template runs these at the repo
      # root, which fails here: `dotnet publish` cannot target a solution with
      # multiple publishable projects, and would otherwise pick MarketEye.Web.
      - name: Restore
        run: dotnet restore MarketEye.sln

      - name: Build API
        run: dotnet build src/MarketEye.Api/MarketEye.Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish src/MarketEye.Api/MarketEye.Api.csproj -c Release --no-build -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA0F5C1E74CF4FE68A9418B9D091F847 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7D2CF069593B4E0DA61691118A9FCB0B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_72023B24D8314A0A97E546B603A73EE6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'marketeye-api'
          slot-name: 'Production'
          package: .

# Tests are deliberately absent from this workflow. ci.yml already runs them on
# every push to main; duplicating them here doubles Actions minutes and lets a
# deploy fail for a reason that has nothing to do with deploying.

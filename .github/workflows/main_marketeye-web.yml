# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Mirrors main_marketeye-api.yml exactly, for the Blazor Server frontend instead of the API.
# MarketEye.Web is already decoupled from MarketEye.Api at the network level -- it calls the API
# over HTTP using a base URL read from config (Program.cs: builder.Services.AddHttpClient("api", ...)
# reads Api:BaseUrl, defaulting to localhost:5199 for local dev) -- so deploying it to its own App
# Service needs no code change, only the Api__BaseUrl app setting pointed at the deployed API
# (see the setup notes at the bottom of this file).

name: Build and deploy ASP.Net Core app to Azure Web App - marketeye-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.400; keep this in the same band so the runner
          # does not resolve an SDK the solution refuses to build with.
          dotnet-version: '10.0.x'

      # Restore the whole solution (project references span all 11 projects) but build and
      # publish ONLY the Web frontend. Azure's default template runs `dotnet publish` at the repo
      # root, which fails on a multi-project solution and would otherwise resolve to whichever
      # publishable project it finds first -- the same problem main_marketeye-api.yml's own
      # comment already documents for the API's workflow, mirrored here for the opposite project.
      - name: Restore
        run: dotnet restore MarketEye.sln

      - name: Build Web
        run: dotnet build src/MarketEye.Web/MarketEye.Web.csproj --configuration Release --no-restore

      - name: Publish Web
        run: dotnet publish src/MarketEye.Web/MarketEye.Web.csproj -c Release --no-build -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app-web
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app-web

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_WEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_WEB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_WEB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'marketeye-web'
          slot-name: 'Production'
          package: .

# Tests are deliberately absent from this workflow. ci.yml already runs them on
# every push to main; duplicating them here doubles Actions minutes and lets a
# deploy fail for a reason that has nothing to do with deploying.

# --- One-time setup this workflow depends on (Azure/GitHub side, not this repo) -----------------
#
# 1. Create the App Service ('marketeye-web' above is a placeholder -- App Service names are
#    globally unique, so pick a real available name and update `app-name` here to match).
#    F1 (free) tier, same as marketeye-api, per docs/adr/0006.
# 2. Connect it to this GitHub repo via the App Service's own Deployment Center ->
#    "GitHub Actions" in the Azure Portal. That flow creates the OIDC federated credential AND
#    adds the three secrets below to this repo automatically -- it's how AZUREAPPSERVICE_CLIENTID_*
#    etc. already exist for marketeye-api. If it names the secrets with its own GUID suffix instead
#    of the plain names below, either rename them or update this file's `secrets.*` references to
#    match what it generated.
#      - AZUREAPPSERVICE_CLIENTID_WEB
#      - AZUREAPPSERVICE_TENANTID_WEB
#      - AZUREAPPSERVICE_SUBSCRIPTIONID_WEB
# 3. The wizard usually also commits its own workflow file — delete or replace it with this one
#    once it's added, so there aren't two competing deploy workflows for the same app.
# 4. On the new App Service, set the app setting `Api__BaseUrl` to the deployed API's URL
#    (e.g. `https://marketeye-api.azurewebsites.net`) -- this is the only configuration
#    MarketEye.Web needs to find the API; nothing else changes between local dev and Azure.
